    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        black: '#0a0a0a',
                        gray: {
                            100: '#f4f4f5',
                            500: '#71717a',
                            900: '#18181b'
                        }
                    }
                }
            }
        }
    </script>

    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        /* Mobile App Feel setup */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: clip;
            background-color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        /* Subtle Aurora Mesh Gradient */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-color: #ffffff;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 0, 0, 0.12), transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(0, 0, 0, 0.1), transparent 45%),
                radial-gradient(circle at 50% 80%, rgba(100, 100, 100, 0.12), transparent 50%);
            filter: blur(40px);
        }

        /* View Management */
        .view-section {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding-bottom: 100px;
        }
        #view-home {
            padding-bottom: 0 !important;
            min-height: auto;
        }
        .view-section.active {
            display: block;
        }

        /* Hide scrollbars for horizontal lists */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Constraints for desktop to look like a mobile app */
        #app-container {
            width: 100%;
            margin: 0 auto;
            position: relative;
            background: transparent;
            min-height: 100vh;
        }

        /* Card Image setup for GSAP */
        .category-card {
            border-top-left-radius: 36px;
            border-top-right-radius: 36px;
            background-color: #f3f4f6;
            opacity: 1;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* Smooth Image Load */
        img {
            transition: opacity 0.3s ease;
        }
        img[loading] {
            opacity: 0;
        }
        img.loaded {
            opacity: 1;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>

                { id: 6, categoryId: "locales", type: "venta", name: "Local Comercial Esquina", location: "Belgrano, CABA", price: "USD 450.000", beds: 0, baths: 2, area: "100", image: "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=800", description: "Excelente local en esquina sobre avenida principal. Vidriera blindex, persiana metálica automática y entrepiso.", features: ["Vidriera doble altura", "Persiana automática", "Alto tránsito peatonal"] },
                { id: 7, categoryId: "terrenos", type: "venta", name: "Lote al Agua en Barrio Cerrado", location: "Nordelta, Tigre", price: "USD 180.000", beds: 0, baths: 0, area: "800", image: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&q=80&w=800", description: "Último lote disponible al agua en barrio consolidado. Orientación Norte.", features: ["Costa de lago", "Seguridad 24hs", "Club House"] }
            ]
        };

        // --- STATE ---
        let state = {
            operation: 'venta',
            currentCategoryId: null,
            searchQuery: ''
        };

        // --- GSAP Setup ---
        gsap.registerPlugin(ScrollTrigger);
        
        function initApp() {
            // Initial render
            renderCategories();
            
            // Custom Split Text para animar por caracteres sin dependencias premium
            const heroTitle = document.querySelector('#hero-title');
            if (heroTitle) {
                const lines = heroTitle.innerHTML.split(/<br\s*\/?>/i);
                heroTitle.innerHTML = '';
                lines.forEach((line, lineIndex) => {
                    const words = line.split(' ');
                    words.forEach((word, wordIndex) => {
                        const wordSpan = document.createElement('span');
                        wordSpan.style.display = 'inline-block';
                        wordSpan.style.overflow = 'hidden'; // Máscara para cada palabra
                        wordSpan.style.paddingBottom = '0.1em'; // Evitar cortar descensos de letras como la 'p'
                        wordSpan.style.marginBottom = '-0.1em';
                        
                        [...word].forEach(char => {
                            const charSpan = document.createElement('span');
                            charSpan.className = 'char inline-block';
                            charSpan.textContent = char;
                            wordSpan.appendChild(charSpan);
                        });
                        
                        heroTitle.appendChild(wordSpan);
                        if (wordIndex < words.length - 1) heroTitle.appendChild(document.createTextNode(' '));
                    });
                    if (lineIndex < lines.length - 1) heroTitle.appendChild(document.createElement('br'));
                });
            }

            // Animación de caracteres estilo SplitText
            gsap.fromTo('.char', 
                { y: '100%', opacity: 0, rotateZ: 5 }, 
                { y: '0%', opacity: 1, rotateZ: 0, duration: 0.8, stagger: 0.015, ease: "power4.out", delay: 0.1 }
            );

            // Header animation entrance (Icono, Búsqueda, Tabs)
            gsap.fromTo('.header-anim', 
                { y: 30, opacity: 0 }, 
                { y: 0, opacity: 1, duration: 0.8, stagger: 0.1, ease: "power3.out", delay: 0.5 }
            );

            // Setup Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                state.searchQuery = e.target.value.toLowerCase();
                renderCategories();
            });
        }

        function setOperation(op) {
            if (state.operation === op) return;
            state.operation = op;

            // Animate Tabs UI
            const tabVenta = document.getElementById('tab-venta');
            const tabAlquiler = document.getElementById('tab-alquiler');
            const tabBg = document.getElementById('tab-bg');

            if (op === 'venta') {
                tabBg.style.transform = 'translateX(0)';
                tabVenta.classList.replace('text-gray-500', 'text-white');
                tabAlquiler.classList.replace('text-white', 'text-gray-500');
            } else {
                tabBg.style.transform = 'translateX(100%)';
                tabAlquiler.classList.replace('text-gray-500', 'text-white');
                tabVenta.classList.replace('text-white', 'text-gray-500');
            }

            // Re-render
            renderCategories();
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            
            // Filter categories based on available properties for selected operation & search
            const filteredCategories = DB.categories.filter(cat => {
                return DB.properties.some(prop => 
                    prop.categoryId === cat.id && 
                    prop.type === state.operation &&
                    (prop.name.toLowerCase().includes(state.searchQuery) || prop.location.toLowerCase().includes(state.searchQuery))
                );
            });

            if (filteredCategories.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-500">No hay propiedades disponibles.</div>`;
                return;
            }

            container.innerHTML = filteredCategories.map((cat, index) => `
                <div class="category-card sticky top-12 md:top-16 relative w-full h-[380px] md:h-[500px] min-h-[380px] md:min-h-[500px] bg-gray-200 rounded-t-[36px] md:rounded-t-[48px] rounded-b-none overflow-hidden cursor-pointer will-change-transform shadow-[0_-16px_36px_rgba(0,0,0,0.22)] ${index > 0 ? '-mt-16 md:-mt-24' : 'mt-0'} mb-0" style="z-index: ${(index + 1) * 10};" onclick="openCategory('${cat.id}', this)">
                    <img src="${cat.image}" class="absolute -top-[20%] left-0 w-full h-[140%] object-cover parallax-img pointer-events-none" alt="${cat.name}" loading="lazy" onload="this.classList.add('loaded')">
                    <div class="absolute inset-0 bg-gradient-to-b from-black/45 via-transparent to-black/25 pointer-events-none"></div>
                    
                    <div class="absolute inset-0 p-6 md:p-10 pt-8 md:pt-12 flex flex-col justify-start card-content pointer-events-none">
                        <div class="flex justify-between items-center">
                            <h3 class="text-3xl md:text-5xl font-bold text-white tracking-tight drop-shadow-md">${cat.name}</h3>
                            <div class="w-12 h-12 md:w-16 md:h-16 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white border border-white/30 transform transition-transform group-hover:scale-110 shadow-lg">
                                <svg class="w-5 h-5 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Kill old scroll triggers before applying new ones
            ScrollTrigger.getAll().forEach(t => t.kill());

            // Apply Progressive Scroll-Tied Unfold & Parallax Animations
            setTimeout(() => {
                const cards = gsap.utils.toArray('.category-card');

                cards.forEach((card, i) => {
                    const img = card.querySelector('.parallax-img');
                    const content = card.querySelector('.card-content');
                    
                    // Reset animation props preserving z-index
                    gsap.set(card, { clearProps: "transform,opacity,clipPath,filter" });
                    gsap.set(card, { 
                        zIndex: (i + 1) * 10,
                        transformPerspective: 950,
                        transformOrigin: "50% 0%"
                    });

                    if (i === 0) {
                        // First card is fully revealed from the beginning
                        gsap.set(card, { rotateX: 0, scale: 1, opacity: 1, y: 0 });
                        gsap.set(img, { scale: 1.05 });
                        gsap.set(content, { opacity: 1, y: 0, scale: 1 });

                        // Centered parallax for the first card
                        gsap.fromTo(img, 
                            { yPercent: -10 },
                            {
                                yPercent: 10,
                                ease: "none",
                                scrollTrigger: {
                                    trigger: card,
                                    start: "top bottom",
                                    end: "bottom top",
                                    scrub: true
                                }
                            }
                        );
                    } else {
                        // Subsequent cards: Stacked Unfold Cards (Expressive 3D unfold overlapping previous card)
                        gsap.set(card, { 
                            rotateX: 28, 
                            scale: 0.91,
                            y: 0,
                            opacity: 1
                        });
                        gsap.set(img, { scale: 1.3, yPercent: -14 });
                        gsap.set(content, { opacity: 0.35, y: 40, scale: 0.92 });

                        // ScrollTrigger with scrub: 0.8 for a tactile, progressive unfolding with scroll
                        const tl = gsap.timeline({
                            scrollTrigger: {
                                trigger: card,
                                start: "top 92%",    // Starts unfolding while deeply overlapping the previous card
                                end: "top 64px",     // Reaches fully open sticky resting position
                                scrub: 0.8           // Continuous progressive unrolling
                            }
                        });

                        // 1. Card visibly unfolds forward in 3D (Unfold) from the card stack
                        tl.to(card, {
                            rotateX: 0,
                            scale: 1,
                            y: 0,
                            ease: "none"
                        }, 0)
                        // 2. Parallax and image framing inside the unfolding card
                        .to(img, {
                            scale: 1.05,
                            yPercent: 8,
                            ease: "none"
                        }, 0)
                        // 3. Card titles and arrow reveal and rise fluidly into place
                        .to(content, {
                            opacity: 1,
                            y: 0,
                            scale: 1,
                            ease: "none"
                        }, 0);

                        // 4. Subtle stack compression for previous card: recedes slightly into the deck
                        if (cards[i - 1]) {
                            tl.to(cards[i - 1], {
                                scale: 0.96,
                                yPercent: -2,
                                ease: "none"
                            }, 0);
                        }
                    }
                });

                ScrollTrigger.refresh();
            }, 60);
        }

        function openCategory(categoryId, cardElement) {
            state.currentCategoryId = categoryId;
            const catData = DB.categories.find(c => c.id === categoryId);

            // 1. Tap Interaction (Feedback visual táctil)
            gsap.to(cardElement, { 
                scale: 0.94, 
                duration: 0.2, 
                ease: "power2.in",
                onComplete: () => {
                    performCategoryTransition(catData, cardElement);
                    // Restablecer la escala inmediatamente para que al volver esté 100% en su tamaño normal
                    gsap.set(cardElement, { scale: 1 });
                }
            });
        }

        function performCategoryTransition(catData, cardElement) {
            const homeView = document.getElementById('view-home');
            const catView = document.getElementById('view-category');
            
            // Elementos del nuevo header a animar
            const headerContainer = document.getElementById('cat-header-container');
            const headerImg = document.getElementById('cat-header-img');
            const headerContent = document.querySelectorAll('.cat-header-content-anim');
            
            // Set data for category view
            headerImg.src = catData.image;
            document.getElementById('cat-header-title').innerText = catData.name;
            document.getElementById('cat-header-op').innerText = state.operation;
            
            renderProperties(catData.id);

            // Preparamos la nueva vista simulando que es la card comprimida
            gsap.set(catView, { display: 'block', opacity: 1 });
            gsap.set(headerContainer, {
                clipPath: "inset(35% 0% 35% 0% round 36px 36px 0px 0px)",
                y: 60,
                scale: 0.98
            });
            gsap.set(headerImg, { scale: 1.5 }); // Arranca muy zoomeada
            gsap.set(headerContent, { opacity: 0, y: 30 }); // Escondemos textos y botones
            gsap.set('#properties-container', { opacity: 0 }); // Escondemos lista de propiedades
            
            const tl = gsap.timeline();
            
            // 1. Desaparece el Home
            tl.to(homeView, {
                opacity: 0,
                scale: 0.95,
                duration: 0.5,
                ease: "power3.inOut",
                onComplete: () => {
                    homeView.classList.remove('active');
                    homeView.style.display = 'none';
                    gsap.set(homeView, { clearProps: "all" });
                }
            }, 0)
            
            // 2. MAGIA: El header se expande (Hero Transition)
            .to(headerContainer, {
                clipPath: "inset(0% 0% 0% 0% round 0px)", // Se abre completamente
                y: 0,
                scale: 1,
                duration: 1.2,
                ease: "power4.inOut",
                onStart: () => {
                    catView.classList.add('active');
                    window.scrollTo(0, 0); // scroll to top
                }
            }, 0.1)
            .to(headerImg, {
                scale: 1, // El zoom se acomoda
                duration: 1.2,
                ease: "power4.inOut"
            }, 0.1)
            
            // 3. Aparecen textos del header con delay
            .to(headerContent, {
                opacity: 1,
                y: 0,
                duration: 0.8,
                stagger: 0.1,
                ease: "back.out(1.5)"
            }, "-=0.6")
            
            // 4. Capsule Reveal Mask Animation de las propiedades en grilla de 2 columnas
            .to('#properties-container', { opacity: 1, duration: 0.1 }, "-=0.6")
            .fromTo('.prop-card', 
                { 
                    clipPath: "inset(28% 18% 28% 18% round 9999px)",
                    scale: 0.82,
                    y: 35,
                    opacity: 0,
                    filter: "blur(5px)"
                },
                { 
                    clipPath: "inset(0% 0% 0% 0% round 24px)",
                    scale: 1,
                    y: 0,
                    opacity: 1,
                    filter: "blur(0px)",
                    duration: 0.95,
                    stagger: {
                        each: 0.08,
                        from: "start"
                    },
                    ease: "power4.out"
                },
                "-=0.6"
            )
            .fromTo('.prop-card img',
                { scale: 1.35 },
                { scale: 1, duration: 1.05, stagger: 0.08, ease: "power3.out" },
                "<"
            );
        }

        function renderProperties(categoryId) {
            const container = document.getElementById('properties-container');
            
            const props = DB.properties.filter(p => 
                p.categoryId === categoryId && 
                p.type === state.operation &&
                (p.name.toLowerCase().includes(state.searchQuery) || p.location.toLowerCase().includes(state.searchQuery))

            container.innerHTML = props.map(prop => `

                    <div class="relative w-full h-36 sm:h-48 md:h-56 overflow-hidden shrink-0 bg-gray-100">

        function openProperty(propId, cardElement) {
            const prop = DB.properties.find(p => p.id === propId);
            const catView = document.getElementById('view-category');
            const propView = document.getElementById('view-property');
            
            // Populate Detail View
            document.getElementById('prop-img').src = prop.image;

            gsap.to(propView, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", onStart: () => {

                // Animate bottom bar up
                gsap.to('#action-bar', { y: 0, duration: 0.6, ease: "back.out(1)", delay: 0.3 });

        function goBackToHome() {
            const homeView = document.getElementById('view-home');
            const catView = document.getElementById('view-category');
            const headerContainer = document.getElementById('cat-header-container');
            const headerContent = document.querySelectorAll('.cat-header-content-anim');

            // Asegurar que todas las tarjetas de categorías estén al 100% de su tamaño
            gsap.set('.category-card', { scale: 1 });

            gsap.set(homeView, { display: 'block', opacity: 0, scale: 0.98 });
            
            const tl = gsap.timeline({
                onComplete: () => {
                    catView.classList.remove('active');
                    catView.style.display = 'none';
                    homeView.classList.add('active');
                    // Reset properties to avoid issues on next entry
                    gsap.set(headerContainer, { clearProps: "all" });
                    ScrollTrigger.refresh();

            tl.to(headerContent, { opacity: 0, y: -20, duration: 0.3 }, 0)
            .to('.prop-card', { opacity: 0, y: 40, duration: 0.3, stagger: 0.05, ease: "power2.in" }, 0)
            .to(headerContainer, {
                clipPath: "inset(25% 0% 25% 0% round 36px 36px 0px 0px)",

                y: 60,
                scale: 0.98,
                duration: 0.5,
                ease: "power4.inOut"
            }, 0.1)
            .to(homeView, { 
                opacity: 1, 
                scale: 1, 
                duration: 0.6, 
                ease: "power3.out"

            // Hide bottom bar
            gsap.to('#action-bar', { y: '100%', duration: 0.3, ease: "power2.in" });

            gsap.set(catView, { display: 'block', opacity: 0, x: -50 });
            
            gsap.to(propView, { opacity: 0, x: 100, duration: 0.4, ease: "power2.inOut", onComplete: () => {
                propView.classList.remove('active');
                propView.style.display = 'none';
            }});
            
            gsap.to(catView, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", delay: 0.1, onStart: () => {
                catView.classList.add('active');
            }});
        }

        // Initialize App on load
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
